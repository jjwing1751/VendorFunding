# Render Blueprint: one web service + one PostgreSQL database.
# In Render: New + > Blueprint > pick this repo. You'll be asked for ADMIN_EMAIL and DEMO_PASSWORD.
databases:
  - name: fundline-db
    databaseName: fundline
    user: fundline
    plan: basic-256mb

services:
  - type: web
    name: fundline
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run render-start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: fundline-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: Fundline Admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
      # One shared demo login per role (see Admin > Demo accounts). Set to "false" before real users join.
      - key: DEMO_ACCOUNTS
        value: "true"
      # Shared password for the demo logins: 12+ characters, 3 of upper/lower/digit/symbol.
      # Leave blank to have one generated and printed once in the first deploy's log.
      - key: DEMO_PASSWORD
        sync: false
      - key: RETAILER_NAME
        value: Northfield Market
